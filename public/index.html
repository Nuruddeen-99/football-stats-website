<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Footy Stats - Modern Football Statistics, League Standings, Live Fixtures, Team & Player Insights" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <title>Footy Stats - Football Statistics & News</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>You need to enable JavaScript to use Footy Stats.</noscript>
    <api-sports-widget data-type="config"
      data-key="%REACT_APP_API_KEY%"
      data-sport="football"
      data-lang="en"
      data-theme="blue"
      data-show-logos="true"
      data-show-error="true"
      data-target-game="modal"
      data-target-team="modal"
      data-target-player="modal"
      data-target-league="modal"
    ></api-sports-widget>
    <script type="module" src="https://widgets.api-sports.io/3.1.0/widgets.js"></script>
  </body>
</html>
